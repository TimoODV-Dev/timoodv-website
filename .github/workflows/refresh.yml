# Rebuilds the site every day so the latest YouTube video and Spotify/Apple releases stay current.
# One-time setup:
#   1. Cloudflare dashboard -> Workers & Pages -> timoodv-website -> Settings -> Builds & deployments -> Deploy hooks -> create one.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret: CF_DEPLOY_HOOK = the hook URL.
name: Refresh site data
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily (05:17 SAST)
  workflow_dispatch:
permissions: {}
jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK not set"; exit 1; fi
          curl --fail --silent --show-error -X POST "$HOOK"
