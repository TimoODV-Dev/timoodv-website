# Runs the tests and a full build on every pull request, so a bad entry (for example a gig added by Grok) is caught before merging.
name: Check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # No secrets on pull requests: the build must work with placeholders only.
          INSTAGRAM_ACCESS_TOKEN: ""
